name: CI/CD Pipeline

 

on:
  push:
    branches: [ main ]

 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

 

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

 

      - name: Install dependencies
        run: pip install -r requirements.txt

 

      - name: Run tests
        run: python -m pytest test_app.py -v

 

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

 

      - name: Build Docker image
        run: docker build -t profileguard:v1 .

 

      - name: Run container and health check
        run: |
          docker run -d -p 5000:5000 --name test-container profileguard:v1
          sleep 10
          curl --fail http://localhost:5000/api/health
          docker stop test-container